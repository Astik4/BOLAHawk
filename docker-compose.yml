services:
  target-api:
    build: ./vulnerable-target-api
    container_name: api-security-target
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      # The target is meant to be weak — this is what makes the scanner's
      # JWT weak-secret check reproduce on a clean clone.
      - JWT_SECRET=${TARGET_JWT_SECRET:-secret}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: api-security-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - TARGET_API_URL=http://target-api:5000
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:8080
    depends_on:
      target-api:
        condition: service_healthy

  dashboard:
    build:
      context: ./frontend
    container_name: api-security-dashboard
    ports:
      - "127.0.0.1:8080:80"
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      - backend
